# Release train for bob-cli (package `bob-obsidian`).
#
# One serialized workflow makes every release decision in order:
# guard, CI on the exact SHA, `release-plz update`, fast-forward push,
# `release-plz release`, optional binaries. It needs no PAT and no
# `CARGO_REGISTRY_TOKEN`.
#
# Triggers:
# - schedule at 17 8 * * * and 47 10 * * * UTC (04:17 and 06:47 New York in
#   summer; the second slot is the retry and the guard makes it a no-op
#   after a release).
# - workflow_dispatch with dry_run and override_reason (hotfix_override).
# - push to ci/release/**, always a forced dry run (GitHub only dispatches
#   workflows that exist on the default branch, so scratch branches test the
#   train through a push trigger before landing).
#
# Concurrency: serialized on `release`, never cancelled. The group must never
# equal the CI `ci-*` groups: reusable workflows evaluate `github.workflow`
# as the caller's name and colliding groups deadlock (see docs-publish.yml).
#
# Action pins below were resolved with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` on 2026-10-21:
# checkout v6.1.0, install-action v2.87.29, upload-rust-binary-action v1.30.2.
name: Release

on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the guard, CI and preview without pushing, tagging or publishing
        type: boolean
        default: false
      override_reason:
        description: Hotfix reason that bypasses the once-per-day ceiling (leave empty for normal runs)
        type: string
        default: ""
  push:
    branches: ["ci/release/**"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      go: ${{ steps.guard.outputs.go }}
      mode: ${{ steps.guard.outputs.mode }}
      dry_run: ${{ steps.guard.outputs.dry_run }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve SHA and run the daily guard
        id: guard
        env:
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
          # `gh` and the GitHub REST fallback both need this; Actions does not
          # export GITHUB_TOKEN into the environment unless we pass it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          ARGS=(--sha "$SHA")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 tools/release/train_guard.py "${ARGS[@]}" \
            --override-reason "${{ inputs.override_reason }}" \
            --repo "${{ github.repository }}"

  ci:
    name: ci
    needs: [plan]
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.dry_run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      full: true

  release:
    name: release
    needs: [plan, ci]
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Check out the planned SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Install pinned toolchain
        run: rustup show

      - name: Install release-plz 0.3.173
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: release-plz@0.3.173

      - name: Bump version and changelog
        id: bump
        run: |
          release-plz update
          if [ -n "$(git status --porcelain)" ]; then
            VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): v${VERSION}"
            # Fast-forward only, never force: when master moved the push is
            # rejected, the job fails and nothing ships; the retry slot
            # tests the new HEAD.
            git push origin HEAD:refs/heads/master
          else
            echo "No changes from release-plz update."
          fi

      - name: Publish tag and GitHub Release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs whenever the bump step succeeded, even with no bump, so a
          # bump left over from a failed run still ships. Never set
          # CARGO_REGISTRY_TOKEN and never add rust-lang/crates-io-auth-action:
          # in live mode release-plz performs the Trusted Publishing OIDC
          # exchange itself.
          release-plz release --git-token "$GITHUB_TOKEN" -o json | tee /tmp/release-plz.json
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release: ${TAG}"
            echo ""
            echo "- version: \`${VERSION}\`"
            echo "- tag: \`${TAG}\`"
            echo "- mode: \`${{ needs.plan.outputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: preview
    needs: [plan, ci]
    if: needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the planned SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Install pinned toolchain
        run: rustup show

      - name: Install release-plz 0.3.173
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: release-plz@0.3.173

      - name: Preview the next release
        run: |
          # Dry runs only: never pushes, tags or publishes.
          release-plz update
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          {
            echo "### Release preview (dry run)"
            echo ""
            echo "- planned sha: \`${{ needs.plan.outputs.sha }}\`"
            echo "- mode: \`${{ needs.plan.outputs.mode }}\`"
            echo "- guard: ${{ needs.plan.outputs.go == 'true' && 'GO' || 'SKIP' }}"
            echo "- version after update: \`${VERSION}\`"
            echo ""
            echo "#### git diff --stat"
            echo ""
            echo '```'
            git diff --stat || true
            echo '```'
            echo ""
            echo "#### CHANGELOG diff"
            echo ""
            echo '```diff'
            git diff -- CHANGELOG.md | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `release-plz release --dry-run` is not used: it needs write
          # credentials in git_only mode. `update` plus the diff above is
          # the supported preview.

  binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, release]
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the planned SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Build and upload binaries to the GitHub Release
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: bob,bob_pomodoro,bob_notify,tmux_bob_pomodoro
          tar: unix
          zip: windows
          # `ref`, not `tag`: `tag` is not an input of
          # upload-rust-binary-action (the run ignores it and the step
          # fails on the workflow_dispatch ref). Point at the tag the
          # release job published so assets attach to that Release.
          ref: refs/tags/${{ needs.release.outputs.tag }}
