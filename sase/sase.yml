is_sase_managed: true
memory:
  glossary:
    Pomodoro:
      definition: >-
        A checkbox item in the "Pomodoros" section of my Obsidian daily file that
        represents a particular session (or planned session) of work. Past pomodoros have
        a timespan associated with them and are closed (i.e. checked). Current pomodoros
        have a timespan but are open (i.e. unchecked). Future pomodoros have an empty `()`
        instead of a timespan and are also open (i.e. unchecked).
    Schedule Log:
      definition: >-
        When the `<ctrl+shift+p>` Obsidian keymap is used to add the `scheduled` or
        `priority` dataview property to a task (or when the `bob capture` command's input
        argument contains the special `p:<N>` syntax), we add a `SCHEDULE LOG` bullet that
        contains one sub-bullet that corresponds with each time the task was scheduled /
        re-scheduled.
    Task Link:
      aliases: ["task block link"]
      definition: >-
        A block link to an Obsidian task. These can be located anywhere but, when they are
        the only contents of a sub-bullet on a pomodoro, they are treated as
        logged/planned tasks for that pomodoro. As another special case, transcluded task
        links that are the only contents of a sub-bullet on another Obsidian task are
        treated as sub-tasks (i.e. dependencies) of that task.
repos:
  linked:
    - name: bob-plugins
      path: ~/projects/github/bobs-org/bob-plugins
      description: |
        Source-of-truth monorepo for Bryan's custom Bob Obsidian plugins, deployed to the vault via `bob plugins sync`.
        You should NOT edit these plugins directly in the ~/bob/ directory, as they will be overwritten on the next
        sync. Instead, make changes to this linked repo and, when done, run the `bob plugins sync` command to deploy them
        to the ~/bob/ directory.
  sidecar:
    builtin:
      plans:
        auto_clone: true
      beads:
        auto_clone: true
      agents:
        description:
          Hidden sidecar that stores commit-associated sase agent data for this project.
    custom:
      research:
        description: Durable SASE research reports and generated media.
