<title>Software factories and code reviews with Harjot Gill - The Pragmatic Engineer | Podcast on Spotify</title>
<meta name="description" content="Listen to this episode from The Pragmatic Engineer on Spotify. Brought to You By:• turbopuffer – a vector and full-text search engine built on object storage. It’s fast, cheap, and extremely scalable.• Entire – The Git forge for agent-human collaboration. Built for the scale and throughput of agentic coding.• WorkOS – everything you need to make your app enterprise-ready.—In this conversation, we step into the world of an AI-pilled CEO to explore how their startup works. This episode might as well be a way of succeeding that contradicts the growing convention that AI spending costs are too high and must be clamped down on. Harjot Gill is founder and CEO of CodeRabbit, an AI code review business, and he shipped over 5,000 pull requests last month, spending on AI at a monthly run rate of $250,000(!) It’s certainly not a conventional approach and Harjot gets into detail about the thinking and reasoning behind it.In this episode of The Pragmatic Engineer Podcast, we talk about his background in building software and founding infra startups for the last 30 years, and how things changed into the era of building software factories at CodeRabbit. We talk about why he believes human code review is dead, and how his team maintains quality while shipping at unprecedented speed.We also get into the rising costs of AI development, why Harjot is convinced that tech startups need more funding than ever, and how AI is changing recruitment and the skills for success.Timestamps00:00 Intro03:17 How Harjot shipped over 5,000 pull requests in a month08:46 Harjot’s path into tech and his first startups12:25 Early conviction around AI and founding CodeRabbit14:40 Switching to AI coding20:35 Software factories explained25:37 What’s replacing human code review38:44 Technical debt and deslopping tests46:05 Evals50:25 Formal methods52:05 AI cost at CodeRabbit54:57 Startup funding in 2026 and the value of AI spend1:08:20 Hiring1:13:03 Work pace, sleep, and burnout1:21:55 Skills for the AI era1:24:30 Book recommendation—The Pragmatic Engineer deepdives relevant for this episode:• Inside OpenAI’s agentic software factory• What is happening with code reviews?• What’s the ROI of software engineers’ spending on AI?• Why Ramp built its own in-house coding agent, Inspect• AI SRE: what is it, how could it change on-call – and does it work?• Context engineering with Dex Horthy• Formal methods with Hillel Wayne • Building Codex with Tibo Sottiaux—Production and marketing by ⁠⁠⁠⁠⁠⁠⁠⁠https://penname.co/⁠⁠⁠⁠⁠⁠⁠⁠. For inquiries about sponsoring the podcast, email podcast@pragmaticengineer.com. Get full access to The Pragmatic Engineer at newsletter.pragmaticengineer.com/subscribe"/>
