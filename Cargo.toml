[package]
name = "bob-obsidian"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Command-line tools for Bob, a GTD workflow that lives in one Obsidian vault"
repository = "https://github.com/bobs-org/bob-cli"
homepage = "https://bobs-org.github.io/"
documentation = "https://bobs-org.github.io/"
readme = "README.md"
license = "MIT"
default-run = "bob"
keywords = ["obsidian", "gtd", "pomodoro", "cli", "tasks"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
    "/assets/**",
    "/src/**",
    "/scripts/bob_notify",
    "/scripts/bob_pomodoro",
    "/scripts/tmux_bob_pomodoro",
    "/scripts/lib/bob_shell.sh",
    "/scripts/gkeep_adapter.py",
    "/scripts/web_clip/web_clip_adapter.py",
    "/scripts/web_clip/snapshot.js",
    "/scripts/web_clip/web_clip_render.py",
    "/scripts/web_clip/diagram_render.py",
    "/scripts/web_clip/vendor/defuddle.full.js",
    "/scripts/web_clip/vendor/DEFUDDLE_LICENSE",
    "/scripts/web_clip/vendor/mermaid.min.js",
    "/scripts/web_clip/vendor/MERMAID_LICENSE",
    "/scripts/web_clip/vendor/README.md",
    "/scripts/web_clip/template/reader.css",
    "/scripts/web_clip/fonts/**",
]

[lib]
name = "bob_cli"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = "4.6.6"
# Exact pin: `unstable-dynamic` is semver-exempt, and it also enables
# `clap/unstable-ext`. Only `native::completion::engine` may import this crate.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
fs2 = "0.4"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
memchr = "2.8"
lopdf = { version = "0.40.0", default-features = false }
regex = "1.12"
rquickjs = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
sha2 = "0.11.0"
shlex = "2.0.1"
similar = "2"
ttf-parser = { version = "0.25.1", default-features = false }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
plist = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[[bin]]
name = "bob"
path = "src/main.rs"

[[bin]]
name = "bob_pomodoro"
path = "src/bin/bob_pomodoro.rs"

[[bin]]
name = "bob_notify"
path = "src/bin/bob_notify.rs"

[[bin]]
name = "tmux_bob_pomodoro"
path = "src/bin/tmux_bob_pomodoro.rs"
