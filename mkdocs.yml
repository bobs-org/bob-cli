site_name: Bob
site_url: https://bobs-org.github.io/
site_description: Bob combines a Rust CLI, Obsidian plugins, and Mac Capture into one honest GTD workflow.
site_author: Bryan Bugyi
copyright: MIT License — see the project LICENSE.
repo_url: https://github.com/bobs-org/bob-cli
repo_name: bobs-org/bob-cli
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: target/docs/site
strict: true
use_directory_urls: true

validation:
  absolute_links: warn
  anchors: warn
  omitted_files: warn
  unrecognized_links: warn
  nav:
    not_found: warn
  links:
    anchors: warn
    not_found: warn

exclude_docs: |
  README.md
  _meta/
  _templates/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  variant: classic
  font: false
  logo: assets/bob-mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/bob.css

plugins:
  - search
  - redirects: {}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
        - name: bob-task
          class: bob-task
          format: !!python/name:bob_docs.fences.fence_format ''
          validator: !!python/name:bob_docs.fences.fence_validator ''
  - github-callouts

nav:
  - Home: index.md
  - Reference:
      - Overview: reference/index.md
      - CLI:
          - Command index: reference/cli/index.md
          # BEGIN GENERATED: cli nav
          - "Daily workflow":
              - "bob capture": reference/cli/capture.md
              - "bob freshness": reference/cli/freshness.md
              - "bob plan": reference/cli/plan.md
              - "bob pomodoro": reference/cli/pomodoro.md
              - "bob ready": reference/cli/ready.md
              - "bob stats": reference/cli/stats.md
          - "Tasks and projects":
              - "bob projects": reference/cli/projects.md
              - "bob task": reference/cli/task.md
          - "Vault":
              - "bob articles": reference/cli/articles.md
              - "bob nightly": reference/cli/nightly.md
              - "bob query": reference/cli/query.md
              - "bob ref": reference/cli/ref.md
              - "bob vault-sync": reference/cli/vault-sync.md
          - "Integrations":
              - "bob gkeep": reference/cli/gkeep.md
          - "Setup":
              - "bob completion": reference/cli/completion.md
              - "bob plugins": reference/cli/plugins.md
          - "Capture protocol":
              - "bob capture-complete": reference/cli/capture-complete.md
              - "bob capture-parse": reference/cli/capture-parse.md
              - "bob capture-pomodoro-name": reference/cli/capture-pomodoro-name.md
              - "bob capture-pomodoros": reference/cli/capture-pomodoros.md
              - "bob capture-rewrite": reference/cli/capture-rewrite.md
              - "bob capture-sections": reference/cli/capture-sections.md
              - "bob capture-targets": reference/cli/capture-targets.md
