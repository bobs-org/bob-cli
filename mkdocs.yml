site_name: Bob
site_url: https://bobs-org.github.io/
site_description: Bob combines a Rust CLI, Obsidian plugins, and Mac Capture into one honest GTD workflow.
site_author: Bryan Bugyi
copyright: MIT License — see the project LICENSE.
repo_url: https://github.com/bobs-org/bob-cli
repo_name: bobs-org/bob-cli
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: target/docs/site
strict: true
use_directory_urls: true

validation:
  absolute_links: warn
  anchors: warn
  omitted_files: warn
  unrecognized_links: warn
  nav:
    not_found: warn
  links:
    anchors: warn
    not_found: warn

exclude_docs: |
  README.md
  _meta/
  _templates/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  variant: classic
  font: false
  logo: assets/bob-mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/bob.css

plugins:
  - search
  - redirects: {}
  - tags:
      listings: false
      export: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
        - name: bob-task
          class: bob-task
          format: !!python/name:bob_docs.fences.fence_format ''
          validator: !!python/name:bob_docs.fences.fence_validator ''
  - github-callouts

